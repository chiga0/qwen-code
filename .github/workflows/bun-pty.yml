name: 'bun-pty'

on:
  pull_request:
    paths:
      - 'packages/core/src/utils/bun-pty.ts'
      - 'packages/core/src/utils/getPty.ts'
      - 'scripts/check-bun-pty.mjs'
      - '.github/workflows/bun-pty.yml'
  workflow_dispatch:

permissions:
  contents: 'read'

jobs:
  bun-pty:
    name: 'Bun PTY backend (real runtime)'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    steps:
      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
      # Pinned to DEFAULT_BUN_VERSION (scripts/build-standalone-release.js,
      # the --runtime=bun archive flavor): a gating check must not silently
      # follow 'latest'.
      - uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # v2.2.0
        with:
          bun-version: '1.3.14'
      # The gate imports the backend's TypeScript source directly and spawns
      # real ptys, so it needs no install and no build step.
      - name: 'Bun PTY backend gate'
        run: 'bun scripts/check-bun-pty.mjs'
